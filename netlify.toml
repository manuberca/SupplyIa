# Deploy en Netlify. Node sale de .nvmrc. Las variables de entorno se cargan en el panel.

[build]
  command = "npm run build"
  publish = "dist"

# Solo se publica main (SPEC §3). Los deploys de pull requests y de otras ramas
# se cancelan antes de construir, para no gastar créditos.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# La redirección de la app de una sola página está en public/_redirects.

# El service worker y el manifest siempre frescos, para que la app instalada se actualice.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos con hash en el nombre no cambian nunca.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
